org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false

# Disable the dex artifact transform — it creates filenames using Maven
# dependency coordinates (e.g. okhttp3:okhttp:4.12.0) which contain colons.
# Colons are invalid in Windows filenames, causing IOException regardless of
# path length or long-path support being enabled.
android.enableDexingArtifactTransform=false
android.enableDexingArtifactTransform.desugaring=false

android.useAndroidX=true
